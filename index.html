<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVERNSUPERBOTS</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#222;background:#fff}
h1{font-size:18px;margin:0}
h2{font-size:12px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.6px;color:#666}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #ddd}
button,select,input{font:inherit;padding:7px 10px;border:1px solid #bbb;border-radius:4px;background:#fff;color:#222}
button{cursor:pointer}button.p{background:#222;color:#fff;border-color:#222}
.m{color:#666}.g{color:#0a7d2c}.r{color:#b00020}
label.row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #eee;cursor:pointer}
label.row.off{color:#999;cursor:default}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f label{font-size:12px;color:#666;display:flex;flex-direction:column;gap:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 2px;border-bottom:1px solid #eee}
#lg{font-size:11px;color:#777;white-space:pre-wrap;max-height:100px;overflow:auto;margin-top:8px}
</style></head><body>

<header><h1>LOVERNSUPERBOTS</h1>
<div><span id="who" class="m"></span> <button id="lb" class="p">Login</button><button id="out" hidden>Log out</button></div></header>
<p id="st" class="m"></p>

<div id="acc" hidden>
<h2>Account</h2>
<select id="as"></select> <button id="cb" class="p">Connect</button> <button id="db" hidden>Disconnect</button>
<div class="m" style="margin-top:6px">Balance: <b id="bal">-</b> <b id="rw" class="r" hidden>REAL MONEY</b></div>
</div>

<h2>Market</h2>
<select id="sy"></select> <b id="px" style="margin-left:8px">-</b>

<h2>Bots</h2>
<div id="bl"></div>

<h2>Settings</h2>
<div class="f">
<label>Stake<input id="sk" type="number" min="0.35" step="0.01" value="1"></label>
<label>Duration (ticks)<input id="du" type="number" min="1" max="10" value="5"></label>
<label>Stop loss<input id="sl" type="number" min="0" step="0.01" value="10"></label>
<label>Take profit<input id="tp" type="number" min="0" step="0.01" value="10"></label>
<label>Max trades<input id="mt" type="number" min="1" value="50"></label>
</div>
<p><button id="go" class="p">Run bot</button><button id="stp" hidden>Stop bot</button> <span id="state" class="m">Idle</span></p>

<h2>Results</h2>
<p>Trades <b id="n">0</b> &middot; Won / Lost <b id="wl">0 / 0</b> &middot; Profit / Loss <b id="pl">0.00</b></p>
<table><tbody id="hb"></tbody></table>
<div id="lg"></div>

<p class="m" style="font-size:12px;margin-top:24px">Trading involves risk and you can lose your stake. No bot guarantees profit. Start on a demo account.</p>

<script>
const D = 'de' + 'riv';
const CID = '3524LFH0TwjKK3ubwGXHy';
const RU  = 'https://cherokins.github.io/LOVERNSUPERBOTS/';
const SC  = 'trade account_manage';
const AU  = `https://auth.${D}.com/oauth2/auth`;
const TU  = `https://auth.${D}.com/oauth2/token`;
const API = `https://api.${D}ws.com`;
const PUB = `wss://api.${D}ws.com/trading/v1/options/ws/public`;

const SYM = [['1HZ100V','Volatility 100 (1s)'],['1HZ75V','Volatility 75 (1s)'],['1HZ50V','Volatility 50 (1s)'],
             ['1HZ25V','Volatility 25 (1s)'],['1HZ10V','Volatility 10 (1s)'],['R_100','Volatility 100']];
const lk = (h, k) => h.slice(-k);
const BOTS = [
 { name:'Momentum Follower', desc:'Buys Rise after 3 rising ticks in a row, Fall after 3 falling ticks.',
   sig: h => { if (h.length < 4) return null; const [a,b,c,d] = lk(h,4);
     return b>a&&c>b&&d>c ? 'CALL' : b<a&&c<b&&d<c ? 'PUT' : null; } },
 { name:'Reversal Catcher', desc:'Buys Fall after 3 rising ticks, Rise after 3 falling ticks.',
   sig: h => { if (h.length < 4) return null; const [a,b,c,d] = lk(h,4);
     return b>a&&c>b&&d>c ? 'PUT' : b<a&&c<b&&d<c ? 'CALL' : null; } },
 { name:'Average Pullback', desc:'Buys Rise when price is below its 10-tick average, Fall when above.',
   sig: h => { if (h.length < 10) return null; const m = lk(h,10).reduce((x,y)=>x+y,0)/10, p = h[h.length-1];
     return p<m ? 'CALL' : p>m ? 'PUT' : null; } }
];
const PREMIUM = ['Premium bot 1', 'Premium bot 2'];

const $ = (id) => document.getElementById(id);
let tok = null, accs = [], acc = null, ws = null, pw = null, rid = 0, bot = null, R = null;
let cur = SYM[0][0];
const H = {}, PQ = {};
SYM.forEach(([s]) => H[s] = []);

function st(m, c) { const e = $('st'); e.textContent = m; e.className = c || 'm'; }
function lg(m) {
  const e = $('lg'); const l = e.textContent ? e.textContent.split('\n') : [];
  l.push(new Date().toLocaleTimeString() + '  ' + m); e.textContent = l.slice(-30).join('\n'); e.scrollTop = e.scrollHeight;
}
function saveTok(t, s) { sessionStorage.setItem('dt', t); sessionStorage.setItem('de', String(Date.now() + s * 1000)); }
function clearTok() { sessionStorage.removeItem('dt'); sessionStorage.removeItem('de'); }
function loadTok() {
  const t = sessionStorage.getItem('dt'), e = +sessionStorage.getItem('de') || 0;
  if (t && Date.now() < e - 30000) return t;
  clearTok(); return null;
}

/* ---------- live prices (no login needed) ---------- */
function pub() {
  pw = new WebSocket(PUB);
  pw.onopen = () => SYM.forEach(([s], i) => { PQ[i + 1] = s; pw.send(JSON.stringify({ ticks: s, subscribe: 1, req_id: i + 1 })); });
  pw.onmessage = (m) => {
    let d; try { d = JSON.parse(m.data); } catch (e) { return; }
    if (d.msg_type !== 'tick' || !d.tick) return;
    const s = PQ[d.req_id] || d.tick.symbol; if (!H[s]) return;
    H[s].push(+d.tick.quote); if (H[s].length > 60) H[s].shift();
    if (s === cur) { $('px').textContent = d.tick.quote; if (R && !R.busy) think(); }
  };
  pw.onclose = () => setTimeout(pub, 3000);
}

/* ---------- login (PKCE) ---------- */
const b64 = (b) => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd = () => { const a = new Uint8Array(32); crypto.getRandomValues(a); return b64(a); };

async function login() {
  const v = rnd(), s = rnd();
  sessionStorage.setItem('pv', v); sessionStorage.setItem('ps', s);
  const ch = b64(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  location.href = AU + '?' + new URLSearchParams({
    response_type: 'code', client_id: CID, redirect_uri: RU, scope: SC, state: s,
    code_challenge: ch, code_challenge_method: 'S256'
  });
}

async function callback() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return;
  history.replaceState({}, '', location.pathname);
  if (p.get('error')) { st('The login service returned an error: ' + p.get('error'), 'r'); return; }
  const es = sessionStorage.getItem('ps'), v = sessionStorage.getItem('pv');
  sessionStorage.removeItem('ps'); sessionStorage.removeItem('pv');
  if (!es || p.get('state') !== es) { st('Login check failed. Please try again.', 'r'); return; }
  try {
    st('Signing you in...');
    const r = await fetch(TU, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'authorization_code', client_id: CID, code: p.get('code'), redirect_uri: RU, code_verifier: v })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) { st('Login failed (HTTP ' + r.status + ').', 'r'); return; }
    saveTok(d.access_token, +d.expires_in || 3600);
  } catch (e) { st('Login failed: ' + e.message, 'r'); }
}

function loggedOut() {
  $('lb').hidden = false; $('out').hidden = true; $('acc').hidden = true; $('who').textContent = '';
  st('Not logged in. Prices below are live; log in to trade.');
}

async function loadAccs() {
  try {
    st('Loading your accounts...');
    const r = await fetch(API + '/trading/v1/options/accounts', { headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 401) { clearTok(); tok = null; loggedOut(); st('Session expired. Please log in again.', 'r'); return; }
    const b = await r.json();
    const l = Array.isArray(b) ? b : (b && Array.isArray(b.data) ? b.data : null);
    if (!r.ok || !l || !l.length) { st('Could not read your accounts (HTTP ' + r.status + ').', 'r'); return; }
    accs = l;
    const s = $('as'); s.textContent = '';
    l.forEach((a) => {
      const o = document.createElement('option'); o.value = a.account_id;
      o.textContent = String(a.account_type).toUpperCase() + ' - ' + a.account_id + ' - ' + a.balance + ' ' + a.currency;
      s.appendChild(o);
    });
    $('lb').hidden = true; $('out').hidden = false; $('acc').hidden = false;
    st('Logged in. Choose a DEMO account and press Connect.', 'g');
  } catch (e) { st('Could not load accounts: ' + e.message, 'r'); }
}

/* ---------- trading connection ---------- */
const send = (o) => { if (ws && ws.readyState === 1) { o.req_id = ++rid; ws.send(JSON.stringify(o)); } };

function closeWs() {
  if (R) stop('Disconnected.');
  if (ws) { const o = ws; ws = null; try { o.close(); } catch (e) {} }
  $('db').hidden = true; $('who').textContent = '';
}

async function connect() {
  acc = accs.find((a) => String(a.account_id) === $('as').value); if (!acc) return;
  if (acc.account_type === 'real' && !confirm('This is a REAL-money account (' + acc.account_id + '). Continue?')) return;
  closeWs();
  try {
    st('Opening a secure connection...');
    const r = await fetch(API + '/trading/v1/options/accounts/' + encodeURIComponent(acc.account_id) + '/otp',
      { method: 'POST', headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 401) { clearTok(); tok = null; loggedOut(); st('Session expired. Please log in again.', 'r'); return; }
    const b = await r.json(), u = b && b.data && b.data.url;
    if (!r.ok || !u) { st('Could not get a connection (HTTP ' + r.status + ').', 'r'); return; }
    openWs(u);
  } catch (e) { st('Connection failed: ' + e.message, 'r'); }
}

function openWs(u) {
  const k = new WebSocket(u); ws = k;
  k.onopen = () => {
    if (ws !== k) return;
    const real = acc.account_type === 'real';
    st('Connected to ' + acc.account_type.toUpperCase() + ' account ' + acc.account_id + '.', 'g');
    $('who').textContent = acc.account_type.toUpperCase() + ' ' + acc.account_id;
    $('bal').textContent = acc.balance + ' ' + acc.currency; $('rw').hidden = !real; $('db').hidden = false;
    send({ balance: 1, subscribe: 1 });
  };
  k.onmessage = (m) => { if (ws !== k) return; let d; try { d = JSON.parse(m.data); } catch (e) { return; } msg(d); };
  k.onerror = () => { if (ws === k) lg('Connection error'); };
  k.onclose = () => {
    if (ws !== k) return; ws = null; if (R) stop('Connection lost.');
    $('db').hidden = true; $('who').textContent = ''; st('Disconnected. Press Connect to reconnect.');
  };
}

/* ---------- bot engine ---------- */
function msg(d) {
  if (d.error) {
    lg('Error: ' + (d.error.message || JSON.stringify(d.error)));
    if (R && R.busy && R.stage !== 'open') { R.busy = false; R.stage = ''; $('state').textContent = 'Waiting for a signal'; }
    return;
  }
  const t = d.msg_type;
  if (t === 'balance' && d.balance) {
    $('bal').textContent = d.balance.balance + ' ' + d.balance.currency;
  } else if (t === 'proposal' && R && R.stage === 'prop' && d.proposal) {
    R.stage = 'buy'; send({ buy: d.proposal.id, price: d.proposal.ask_price });
  } else if (t === 'buy' && R && d.buy) {
    R.stage = 'open'; R.cid = d.buy.contract_id; $('state').textContent = 'Trade open';
    lg('Bought ' + (R.side === 'CALL' ? 'Rise' : 'Fall') + ' at ' + d.buy.buy_price);
    send({ proposal_open_contract: 1, contract_id: R.cid, subscribe: 1 });
  } else if (t === 'proposal_open_contract' && R && d.proposal_open_contract) {
    const c = d.proposal_open_contract;
    if (c.contract_id !== R.cid || !c.is_sold || R.settled) return;
    R.settled = true;
    const pr = +c.profit || 0;
    R.trades++; R.pnl += pr; if (pr > 0) R.w++; else R.l++;
    if (d.subscription && d.subscription.id) send({ forget: d.subscription.id });
    addRow(R.side, R.cfg.stake, pr); showStats();
    const s = R.cfg;
    if (R.pnl <= -s.sl) return stop('Stop loss reached.');
    if (R.pnl >= s.tp) return stop('Take profit reached.');
    if (R.trades >= s.mt) return stop('Max trades reached.');
    R.busy = false; R.stage = ''; $('state').textContent = 'Waiting for a signal';
  }
}

function think() {
  const s = bot.sig(H[cur]); if (!s) return;
  R.busy = true; R.stage = 'prop'; R.side = s; R.settled = false; R.cid = null;
  send({ proposal: 1, amount: R.cfg.stake, basis: 'stake', contract_type: s, currency: acc.currency,
         duration: R.cfg.du, duration_unit: 't', underlying_symbol: cur });
}

function addRow(side, stake, pr) {
  const tr = document.createElement('tr');
  [new Date().toLocaleTimeString(), side === 'CALL' ? 'Rise' : 'Fall', stake.toFixed(2), (pr > 0 ? '+' : '') + pr.toFixed(2)]
    .forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i === 3) td.className = pr > 0 ? 'g' : 'r'; tr.appendChild(td); });
  const b = $('hb'); b.insertBefore(tr, b.firstChild);
  while (b.children.length > 10) b.removeChild(b.lastChild);
}

function showStats() {
  $('n').textContent = R.trades; $('wl').textContent = R.w + ' / ' + R.l;
  const e = $('pl'); e.textContent = R.pnl.toFixed(2); e.className = R.pnl > 0 ? 'g' : R.pnl < 0 ? 'r' : '';
}

function go() {
  if (!bot) { st('Select a bot first.', 'r'); return; }
  if (!ws) { st('Log in and connect an account first.', 'r'); return; }
  const cfg = { stake: +$('sk').value, du: Math.round(+$('du').value), sl: +$('sl').value, tp: +$('tp').value, mt: Math.round(+$('mt').value) };
  if (!(cfg.stake > 0) || !(cfg.du >= 1) || !(cfg.sl > 0) || !(cfg.tp > 0) || !(cfg.mt >= 1)) {
    st('Stake, duration, stop loss, take profit and max trades must all be above zero.', 'r'); return;
  }
  if (acc.account_type === 'real' && !confirm('Run "' + bot.name + '" on your REAL account with a stake of ' + cfg.stake + '?')) return;
  R = { cfg, busy: false, stage: '', trades: 0, w: 0, l: 0, pnl: 0 };
  showStats(); $('hb').textContent = '';
  $('go').hidden = true; $('stp').hidden = false; $('sy').disabled = true;
  $('state').textContent = 'Waiting for a signal'; st('Bot running.', 'g');
  lg('Started ' + bot.name + ' on ' + $('sy').selectedOptions[0].textContent);
}

function stop(why) {
  if (!R) return;
  R = null; $('go').hidden = false; $('stp').hidden = true; $('sy').disabled = false; $('state').textContent = 'Idle';
  lg('Stopped. ' + (why || '') + ' An open trade will still finish.'); st(why || 'Bot stopped.');
}

/* ---------- page setup ---------- */
SYM.forEach(([c, n]) => { const o = document.createElement('option'); o.value = c; o.textContent = n; $('sy').appendChild(o); });
BOTS.forEach((b, i) => {
  const l = document.createElement('label'); l.className = 'row';
  const r = document.createElement('input'); r.type = 'radio'; r.name = 'bot'; r.onchange = () => { bot = b; };
  const t = document.createElement('span');
  const n = document.createElement('b'); n.textContent = b.name;
  const d = document.createElement('span'); d.className = 'm'; d.textContent = b.desc;
  t.append(n, document.createElement('br'), d); l.append(r, t); $('bl').appendChild(l);
});
PREMIUM.forEach((p) => {
  const l = document.createElement('label'); l.className = 'row off';
  const r = document.createElement('input'); r.type = 'radio'; r.disabled = true;
  const t = document.createElement('span'); t.textContent = p + ' - unlocks after payment (coming soon)';
  l.append(r, t); $('bl').appendChild(l);
});

$('sy').onchange = () => { cur = $('sy').value; $('px').textContent = H[cur].length ? H[cur][H[cur].length - 1] : '-'; };
$('lb').onclick = login;
$('cb').onclick = connect;
$('db').onclick = () => { closeWs(); st('Disconnected.'); };
$('go').onclick = go;
$('stp').onclick = () => stop('Stopped by you.');
$('out').onclick = () => { closeWs(); clearTok(); location.href = RU; };

pub();
(async () => {
  await callback();
  tok = loadTok();
  if (tok) await loadAccs(); else if (!$('st').textContent) loggedOut();
})();
</script>
</body></html>
