<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVERNSUPERBOTS</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f6f6f6; --line:#ddd; --err:#b00020; --ok:#0a7d2c; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#aaa; --card:#1e1e1e; --line:#333; --err:#ff6b6b; --ok:#5fd38d; --warn:#ffb74d; }
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.5; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; margin: 8px 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; }
  button, select { font-size: 15px; padding: 8px 14px; margin: 4px 4px 4px 0; }
  button { cursor: pointer; }
  pre { background: var(--card); border: 1px solid var(--line); padding: 10px; border-radius: 6px; font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .err { color: var(--err); } .ok { color: var(--ok); } .warn { color: var(--warn); } .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LOVERNSUPERBOTS</h1>
  <button id="logoutBtn" hidden>Log out</button>
</header>
<p id="status" class="muted">Not logged in.</p>

<section id="loginSec">
  <button id="loginBtn">Login with Deriv</button>
</section>

<section id="accSec" hidden>
  <h2>1. Choose account</h2>
  <select id="accSelect"></select>
  <button id="connectBtn">Connect</button>
</section>

<section id="liveSec" hidden>
  <h2>2. Live connection</h2>
  <p>Account: <b id="accLabel">-</b> <span id="realWarn" class="warn" hidden>(REAL MONEY)</span></p>
  <p>Balance: <b id="balance">-</b></p>
  <label>Market <select id="symSelect"></select></label>
  <p>Price: <b id="price">-</b></p>
  <button id="disconnectBtn">Disconnect</button>
</section>

<pre id="log" hidden></pre>

<script>
const CLIENT_ID    = '3524LFH0TwjKK3ubwGXHy';
const REDIRECT_URI = 'https://cherokins.github.io/LOVERNSUPERBOTS/';
const SCOPE        = 'trade account_manage';
const AUTH_URL     = 'https://auth.deriv.com/oauth2/auth';
const TOKEN_URL    = 'https://auth.deriv.com/oauth2/token';
const API_BASE     = 'https://api.derivws.com';

const SYMBOLS = [
  ['1HZ100V', 'Volatility 100 (1s) Index'],
  ['1HZ75V',  'Volatility 75 (1s) Index'],
  ['1HZ50V',  'Volatility 50 (1s) Index'],
  ['1HZ25V',  'Volatility 25 (1s) Index'],
  ['1HZ10V',  'Volatility 10 (1s) Index'],
  ['R_100',   'Volatility 100 Index'],
  ['R_75',    'Volatility 75 Index'],
  ['R_50',    'Volatility 50 Index'],
  ['R_25',    'Volatility 25 Index'],
  ['R_10',    'Volatility 10 Index']
];

const $ = (id) => document.getElementById(id);
let token = null;
let accounts = [];
let ws = null;
let reqId = 0;

/* ---------- small helpers ---------- */
function setStatus(msg, cls) {
  const s = $('status');
  s.textContent = msg;
  s.className = cls || 'muted';
}

function log(msg) {
  const el = $('log');
  el.hidden = false;
  const lines = el.textContent ? el.textContent.split('\n') : [];
  lines.push(new Date().toLocaleTimeString() + '  ' + msg);
  el.textContent = lines.slice(-40).join('\n');
  el.scrollTop = el.scrollHeight;
}

function saveToken(t, expiresIn) {
  sessionStorage.setItem('deriv_token', t);
  sessionStorage.setItem('deriv_token_exp', String(Date.now() + expiresIn * 1000));
}
function clearToken() {
  sessionStorage.removeItem('deriv_token');
  sessionStorage.removeItem('deriv_token_exp');
}
function loadToken() {
  const t = sessionStorage.getItem('deriv_token');
  const e = Number(sessionStorage.getItem('deriv_token_exp') || 0);
  if (t && Date.now() < e - 30000) return t;
  clearToken();
  return null;
}

/* ---------- login (PKCE) - unchanged from the working test page ---------- */
function b64url(bytes) {
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomString() {
  const a = new Uint8Array(32);
  crypto.getRandomValues(a);
  return b64url(a);
}
async function challengeFrom(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(new Uint8Array(digest));
}

async function login() {
  const verifier = randomString();
  const state = randomString();
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);
  const url = new URL(AUTH_URL);
  url.search = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    scope: SCOPE,
    state: state,
    code_challenge: await challengeFrom(verifier),
    code_challenge_method: 'S256'
  }).toString();
  location.href = url.toString();
}

async function handleCallback() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return;
  history.replaceState({}, '', location.pathname);

  if (p.get('error')) {
    setStatus('Deriv returned an error: ' + p.get('error') + ' ' + (p.get('error_description') || ''), 'err');
    return;
  }
  const expectedState = sessionStorage.getItem('oauth_state');
  const verifier = sessionStorage.getItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');
  sessionStorage.removeItem('pkce_verifier');
  if (!expectedState || p.get('state') !== expectedState) {
    setStatus('State mismatch - login cancelled. Please try again.', 'err');
    return;
  }
  try {
    setStatus('Signing you in...');
    const r = await fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: CLIENT_ID,
        code: p.get('code'),
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    });
    const data = await r.json();
    if (!r.ok || !data.access_token) {
      setStatus('Login failed (HTTP ' + r.status + ').', 'err');
      log(JSON.stringify(data));
      return;
    }
    saveToken(data.access_token, Number(data.expires_in) || 3600);
  } catch (e) {
    setStatus('Login failed: ' + e.message, 'err');
  }
}

/* ---------- screens ---------- */
function showLoggedOut() {
  $('loginSec').hidden = false;
  $('accSec').hidden = true;
  $('liveSec').hidden = true;
  $('logoutBtn').hidden = true;
}

function showLoggedIn() {
  $('loginSec').hidden = true;
  $('accSec').hidden = false;
  $('logoutBtn').hidden = false;
}

/* ---------- accounts ---------- */
async function loadAccounts() {
  try {
    setStatus('Loading your accounts...');
    const r = await fetch(API_BASE + '/trading/v1/options/accounts', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (r.status === 401) {
      clearToken(); token = null; showLoggedOut();
      setStatus('Session expired. Please log in again.', 'err');
      return;
    }
    const body = await r.json();
    const list = Array.isArray(body) ? body : (body && Array.isArray(body.data) ? body.data : null);
    if (!r.ok || !list) {
      setStatus('Could not read your accounts (HTTP ' + r.status + ').', 'err');
      log(JSON.stringify(body, null, 2));
      return;
    }
    accounts = list;
    renderAccounts();
  } catch (e) {
    setStatus('Could not load accounts: ' + e.message, 'err');
  }
}

function renderAccounts() {
  const sel = $('accSelect');
  sel.textContent = '';
  accounts.forEach((a) => {
    const o = document.createElement('option');
    o.value = a.account_id;
    o.textContent = String(a.account_type || '?').toUpperCase() + ' - ' + a.account_id + ' - ' +
                    a.balance + ' ' + a.currency + (a.status && a.status !== 'active' ? ' (' + a.status + ')' : '');
    sel.appendChild(o);
  });
  showLoggedIn();
  if (!accounts.length) {
    setStatus('Logged in, but no accounts were returned.', 'err');
    return;
  }
  setStatus('Logged in. Choose an account and click Connect. Use a DEMO account while testing.', 'ok');
}

/* ---------- live connection ---------- */
function send(obj) {
  if (ws && ws.readyState === 1) {
    obj.req_id = ++reqId;
    ws.send(JSON.stringify(obj));
  }
}

function subscribeTicks(replace) {
  if (replace) send({ forget_all: 'ticks' });
  $('price').textContent = '-';
  send({ ticks: $('symSelect').value, subscribe: 1 });
}

function closeSocket() {
  if (ws) {
    const old = ws;
    ws = null;
    try { old.close(); } catch (e) {}
  }
}

async function connect() {
  const acc = accounts.find((a) => String(a.account_id) === $('accSelect').value);
  if (!acc) return;
  if (acc.account_type === 'real' &&
      !confirm('This is a REAL-money account (' + acc.account_id + '). Continue?')) return;

  closeSocket();
  try {
    setStatus('Opening a secure connection...');
    const r = await fetch(API_BASE + '/trading/v1/options/accounts/' + encodeURIComponent(acc.account_id) + '/otp', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const body = await r.json();
    const url = body && body.data && body.data.url;
    if (r.status === 401) {
      clearToken(); token = null; showLoggedOut();
      setStatus('Session expired. Please log in again.', 'err');
      return;
    }
    if (!r.ok || !url) {
      setStatus('Could not get a connection (HTTP ' + r.status + ').', 'err');
      log(JSON.stringify(body, null, 2));
      return;
    }
    openSocket(url, acc);
  } catch (e) {
    setStatus('Connection failed: ' + e.message, 'err');
  }
}

function openSocket(url, acc) {
  const sock = new WebSocket(url);
  ws = sock;

  sock.onopen = () => {
    if (ws !== sock) return;
    const isReal = acc.account_type === 'real';
    setStatus('Connected to ' + String(acc.account_type).toUpperCase() + ' account ' + acc.account_id + '.', 'ok');
    $('accLabel').textContent = acc.account_id;
    $('realWarn').hidden = !isReal;
    $('balance').textContent = acc.balance + ' ' + acc.currency;
    $('liveSec').hidden = false;
    send({ balance: 1, subscribe: 1 });
    subscribeTicks(false);
  };

  sock.onmessage = (m) => {
    if (ws !== sock) return;
    let d;
    try { d = JSON.parse(m.data); } catch (e) { return; }
    if (d.error) {
      log('API error: ' + (d.error.message || JSON.stringify(d.error)));
      return;
    }
    if (d.msg_type === 'balance' && d.balance) {
      $('balance').textContent = d.balance.balance + ' ' + d.balance.currency;
    } else if (d.msg_type === 'tick' && d.tick) {
      $('price').textContent = d.tick.quote;
    }
  };

  sock.onerror = () => { if (ws === sock) log('WebSocket error'); };
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null;
    $('liveSec').hidden = true;
    setStatus('Disconnected. Click Connect to reconnect.', 'muted');
  };
}

/* ---------- wire up ---------- */
SYMBOLS.forEach(([code, name]) => {
  const o = document.createElement('option');
  o.value = code;
  o.textContent = name;
  $('symSelect').appendChild(o);
});

$('loginBtn').addEventListener('click', login);
$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', () => { closeSocket(); $('liveSec').hidden = true; setStatus('Disconnected.', 'muted'); });
$('symSelect').addEventListener('change', () => subscribeTicks(true));
$('logoutBtn').addEventListener('click', () => { closeSocket(); clearToken(); location.href = REDIRECT_URI; });

(async function init() {
  await handleCallback();
  token = loadToken();
  if (token) await loadAccounts();
  else { showLoggedOut(); if ($('status').textContent === 'Not logged in.') setStatus('Not logged in.'); }
})();
</script>
</body>
</html>
